# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# Indexes the attestation graph that /verify renders. The frontend keeps a direct-RPC reader as a
# fallback (web/lib/logs.ts) because Envio's free tier deletes inactive deployments after 30 days
# and the judging window closes 35 days after our submission date — a verification page that goes
# blank mid-judging would be worse than a slower one.
#
# Local runs need Docker and ENVIO_API_TOKEN (see .env). Deployments on Envio Cloud expose a
# public GraphQL endpoint and need no token in the client.
name: peerproof
disable_default_cross_chain: true

contracts:
  - name: AttendanceEscrow
    handler: src/handlers/AttendanceEscrow.ts
    events:
      - event: "EventCreated(uint256 indexed eventId, address indexed organizer, uint96 deposit, uint32 capacity, uint32 minQuorum, uint8 k, uint64 registerDeadline, uint64 attestOpen, uint64 attestClose)"
      - event: "Registered(uint256 indexed eventId, address indexed attendee, address attestKey)"
      - event: "CheckedIn(uint256 indexed eventId, address indexed attendee, uint64 beaconEpoch)"
      - event: "Attested(uint256 indexed eventId, address indexed attester, address indexed subject, uint64 epoch)"
      - event: "Confirmed(uint256 indexed eventId, address indexed attendee, bool viaOrganizer)"
      - event: "EventCancelled(uint256 indexed eventId, uint32 registered, uint32 minQuorum)"
      - event: "Settled(uint256 indexed eventId, uint32 confirmed, uint32 noShows, uint256 sharePerAttendee)"
      - event: "Claimed(uint256 indexed eventId, address indexed attendee, uint256 amount)"

chains:
  # Monad testnet. Set the address and start_block after deploying; leaving start_block at 0 makes
  # the indexer scan 60M+ empty blocks.
  - id: 10143
    start_block: 61225037
    # Sync over RPC, deliberately, with the block interval pinned.
    #
    # HyperSync would be faster, but since V3 it needs an API token supplied as ENVIO_API_TOKEN —
    # and environment variables are a paid feature on Envio Cloud, so on the free tier there is no
    # way to hand the indexer a token at all. Naming the HyperSync URL here did nothing; the
    # deployment kept reporting `Source: RPC`.
    #
    # It then sat at latest_processed_block = -1 — not slow, not started. No RPC was configured
    # either, and the default block interval is far above the 100 that Monad's own endpoint allows
    # (`eth_getLogs is limited to a 100 range`), so every request would have been rejected and
    # backed off from.
    #
    # 100 is not a guess. Measured across four endpoints on 12 Sep 2026, asking for logs from this
    # contract:
    #
    #   testnet-rpc.monad.xyz      100 ok, 1000 → "eth_getLogs is limited to a 100 range"
    #   monad-testnet.drpc.org     "the method eth_getLogs does not exist/is not available"
    #   10143.rpc.hypersync.xyz    rejected without a token
    #   monad-testnet-rpc.publicnode.com   no response
    #
    # So Monad's own endpoint is the only one that serves logs at all, and it caps at 100. drpc used
    # to allow 10,000 and no longer serves the method — worth re-measuring rather than trusting any
    # of this, including a larger ceiling here, which would make every request fail and back off.
    #
    # ~274,000 blocks at 100 each is ~2,700 requests. Unattractive, but it is a one-time historical
    # sync and it is the reason to run an indexer rather than have every page load do this.
    rpc:
      url: https://testnet-rpc.monad.xyz
      for: sync
      initial_block_interval: 100
      interval_ceiling: 100
    contracts:
      - name: AttendanceEscrow
        address:
          - "0x289a7ce11a3c3e754f346d5f34495fd2d76ad9c1"
