[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
use_literal_content = true
# Monad execution rules + automatic hardfork selection. Do NOT pin evm_version by hand:
# Monad's own Hardhat guide requires "osaka", and that target moves.
network = "monad"

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_alchemy = "https://rpc1.monad.xyz"
monad_goldsky = "https://rpc2.monad.xyz"
monad_ankr = "https://rpc3.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 120
tab_width = 4
