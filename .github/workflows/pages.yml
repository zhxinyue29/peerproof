# Fallback host: GitHub Pages needs no new account, which matters when signup flows demand an SMS
# code you can't receive. The app is a static export with no server, so Pages is sufficient.
#
# Every value below defaults to the live testnet deployment, so a fresh clone deploys a working
# site with no setup. Override any of them with repository variables (Settings → Secrets and
# variables → Actions → Variables): NETWORK only. The contract address, the event and the deploy
# block are written in this file on purpose — see the comment on NEXT_PUBLIC_ESCROW_ADDRESS.
#
# They were variables with no defaults, and nobody had set them — so the site built and deployed
# green while serving "No contract configured". A workflow that succeeds at shipping a broken page
# is worse than one that fails.
#
# Then enable Settings → Pages → Source: GitHub Actions.
#
# ⚠️ The passkey rpId is bound to the host. On a project repo the site is served from
# <user>.github.io/<repo>/, and the rpId is <user>.github.io. Moving hosts later makes every
# passkey account unreproducible — pick one and stay on it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Build static site
        working-directory: web
        env:
          # No NEXT_PUBLIC_DEV_* here on purpose: next.config.ts fails the build if any are set,
          # because they would be inlined into public JavaScript.
          NEXT_PUBLIC_CHAIN: ${{ vars.NETWORK || 'testnet' }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.NETWORK == 'mainnet' && 'https://rpc.monad.xyz' || 'https://testnet-rpc.monad.xyz' }}
          # Left unset on testnet so lib/chain.ts picks the endpoint and the matching chunk size
          # together. They are one decision: a chunk above the endpoint's cap is rejected outright,
          # not merely slow, so splitting them across two files is how they drift apart.
          NEXT_PUBLIC_LOGS_RPC_URL: ${{ vars.NETWORK == 'mainnet' && 'https://rpc3.monad.xyz' || '' }}
          # Written here, not read from a repository variable.
          #
          # A dashboard setting that silently overrides a checked-in default has already cost this
          # project a working demo once: `vars.EVENT_ID` pinned the public site to an event that had
          # ended, and nothing on the page or in the diff said so. Which contract a build talks to is
          # a fact about that build, so it belongs in the file, in the history, next to the change
          # that made it true.
          NEXT_PUBLIC_ESCROW_ADDRESS: '0xEa057c5a6F431eFF29F573E4db4bc49cD52Ee679'
          # Deliberately not `vars.EVENT_ID`. A number here switches off resolve-to-newest, so the
          # site serves one fixed event forever — and a repository variable is invisible from the
          # code, from the build log, and from the page itself. One left over from an afternoon's
          # testing kept the public demo on a finished event through four green deploys; the second
          # time it happened, it survived deleting it, because nobody could find where it was set.
          #
          # To pin a build on purpose, edit this line. That way the reason is in the diff.
          NEXT_PUBLIC_EVENT_ID: latest
          # A public client identifier, not a secret — it is inlined into the bundle by design, and
          # what actually restricts its use is the allowed-origins list in the Privy dashboard. The
          # app secret is a different value and is not used here; nothing in this app talks to
          # Privy's backend.
          #
          # Without this the email path does not render at all: hasPrivy is false, the button never
          # appears, and the only routes left are a PRF passkey or a browser wallet.
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID || 'cmtxucm3301vy0dl7brfcv0ev' }}
          # Without this the reader falls back to scanning the last 20,000 blocks. The contract was
          # deployed ~274,000 blocks ago, so the graph would come back empty and look like nothing
          # ever happened.
          NEXT_PUBLIC_DEPLOY_BLOCK: '63497445'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
